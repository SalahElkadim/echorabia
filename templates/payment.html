{% load static %}
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Pay Now | EchoRabia</title>

  <!-- Moyasar SDK -->
  <script src="https://cdn.moyasar.com/mpf/1.7.3/moyasar.js"></script>

 <style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

  body {
    font-family: "Tajawal", sans-serif;
    background: linear-gradient(135deg, #f8f3ef, #f1e3d3);
    color: #4b3b2b;
    text-align: center;
    padding: 60px 20px;
    direction: rtl;
  }

  h2 {
    font-size: 28px;
    color: #3e2f23;
    margin-bottom: 10px;
  }

  p {
    color: #6d5b4c;
    font-size: 16px;
    margin-bottom: 40px;
  }

  /* ✅ حاوية فورم ميسر */
  .mysr-form {
    background: #ffffff;
    border-radius: 20px;
    padding: 25px;
    width: 360px;
    margin: 0 auto;
    box-shadow: 0 8px 20px rgba(78, 57, 39, 0.15);
    border: 1px solid #e5d6c4;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .mysr-form:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(78, 57, 39, 0.25);
  }

  /* زرار الدفع */
  .mysr-form button,
  .mysr-form input[type="submit"],
  button {
    background: linear-gradient(135deg, #8b5e34, #6f4e2c);
    color: #fff;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .mysr-form button:hover {
    background: linear-gradient(135deg, #9c6d3b, #7a5330);
    transform: scale(1.03);
  }

  /* تحميل */
  .loading {
    opacity: 0.5;
    pointer-events: none;
  }

  /* أنيميشن تحميل بسيط */
  .loading::after {
    content: "جارٍ معالجة الدفع...";
    display: block;
    font-size: 16px;
    color: #6f4e2c;
    margin-top: 15px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
  }

  /* تنسيق عام للموبايل */
  @media (max-width: 480px) {
    body {
      padding: 30px 10px;
    }
    .mysr-form {
      width: 100%;
      padding: 20px;
    }
  }
</style>

</head>

<body>
  <h2>صفحة الدفع</h2>
  <p>الرجاء إتمام عملية الدفع لإتمام الحجز.</p>

  <!-- ✅ فورم ميسر -->
  <div class="mysr-form"></div>
  <script>
    // ✅ تهيئة فورم ميسر
    
  Moyasar.init({
    element: '.mysr-form',
    amount: 100, // بالهللة = 100 ريال
    currency: 'SAR',
    description: 'Booking tour',
    publishable_api_key: 'pk_live_AUPkqG63z5VEJ6XRKMS2fuUtpB3k5LVgyXTER5TE',
    callback_url: 'https://echorabia.com/payment/callback/',
    supported_networks: ['visa', 'mastercard', 'mada'],
    methods: ['creditcard'],

    on_completed: function (payment) {
      console.log("🎟 Token received:", payment.source.token);
      sendTokenToServer(payment.source.token);
    },

    on_failed: function (error) {
      alert("حدث خطأ أثناء إنشاء التوكن: " + error.message);
    }
  });



    // ✅ إرسال التوكن للسيرفر
    function sendTokenToServer(token) {
      const data = {
        booking_id: "{{ booking_id }}",  // تمررها من Django context
        amount: 100,                   // نفس المبلغ المستخدم في الفورم
        description: "حجز استشارة لغوية",
        source: { token: token }
      };

      // إضافة حالة تحميل مؤقتة
      document.body.classList.add('loading');

      fetch("/payment/create/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCSRFToken()
        },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        console.log("📦 Server response:", response);
        document.body.classList.remove('loading');

        const moyasar = response.moyasar_data || {};

        if (moyasar.status === "initiated" && moyasar.source?.transaction_url) {
        // 🟢 تحويل المستخدم لصفحة 3DS البنكية
        window.location.href = moyasar.source.transaction_url;
        } else if (moyasar.status === "paid") {
        window.location.href = "/payment/callback/?status=paid";
        } else {
        alert("فشل الدفع: " + (moyasar.message || "حدث خطأ غير متوقع"));
        }

      })
      .catch(err => {
        document.body.classList.remove('loading');
        console.error("❌ Error:", err);
        alert("حدث خطأ أثناء إرسال الدفع للسيرفر.");
      });
    }

    // 🧩 دالة بسيطة لجلب CSRF من الكوكيز (لو استخدمت Django CSRF)
    function getCSRFToken() {
      const name = 'csrftoken';
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + '=')) {
          return cookie.substring(name.length + 1);
        }
      }
      return '';
    }
  </script>
</body>
</html>
