<!-- templates/payments/callback.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتيجة الدفع</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white shadow-lg rounded-2xl p-8 text-center w-96">
    <div class="text-6xl mb-4">
      {{ icon }}
    </div>
    <h1 class="text-2xl font-bold mb-2">{{ message }}</h1>
    <p class="text-gray-600">رقم العملية: {{ request.GET.id }}</p>

    <a href="/" class="mt-6 inline-block bg-blue-600 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-700 transition">
      الرجوع للصفحة الرئيسية
    </a>
  </div>
</body>
</html>
